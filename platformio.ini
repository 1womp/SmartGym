; Bring-up project aislado para la pantalla VIEWE 7" ESP32-S3.
; Esta configuracion sigue de cerca el ejemplo oficial del fabricante
; para eliminar diferencias de toolchain antes de personalizar el proyecto.

[platformio]
default_envs = BOARD_VIEWE_UEDX80480070E_WB_A
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#53.03.11
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
  https://github.com/lvgl/lvgl.git#v8.4.0
  miguelbalboa/MFRC522 @ ^1.4.12
  mobizt/FirebaseClient @ ^2.2.9
  mobizt/ESP_SSLClient @ ^3.1.3
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -D SMARTGYM_DISPLAY_BRINGUP
  ; Optional production overrides (recommended)
  ; -D SMARTGYM_WIFI_PRIMARY_SSID=\"YourSSID\"
  ; -D SMARTGYM_WIFI_PRIMARY_PASSWORD=\"YourPass\"
  ; -D SMARTGYM_WIFI_SECONDARY_SSID=\"BackupSSID\"
  ; -D SMARTGYM_WIFI_SECONDARY_PASSWORD=\"BackupPass\"
  ; -D SMARTGYM_FIREBASE_DATABASE_URL=\"https://<project>.firebaseio.com\"
  ; -D SMARTGYM_FIREBASE_AUTH_TOKEN=\"<db-secret-or-token>\"
  -I src

[common]
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D ARDUINO_USB_MODE=1 
  -D ARDUINO_USB_CDC_ON_BOOT=0

[rgb_mipi_lcd]
build_flags =
  -D LVGL_PORT_AVOID_TEARING_MODE=3
  -D LVGL_PORT_ROTATION_DEGREE=0

[env:BOARD_VIEWE_UEDX80480070E_WB_A]
board = BOARD_VIEWE_UEDX80480070E_WB_A
board_build.partitions = partitions_16mb_ffat.csv
build_flags =
  ${env.build_flags}
  ${common.build_flags}
  ${rgb_mipi_lcd.build_flags}
  -D BOARD_VIEWE_UEDX80480070E_WB_A

[env:viewe_7inch_s3]
board = BOARD_VIEWE_UEDX80480070E_WB_A
board_build.partitions = partitions_16mb_ffat.csv
build_flags =
  ${env.build_flags}
  ${common.build_flags}
  ${rgb_mipi_lcd.build_flags}
  -D BOARD_VIEWE_UEDX80480070E_WB_A
